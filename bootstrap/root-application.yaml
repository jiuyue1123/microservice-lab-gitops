apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: microservice-lab-root
  namespace: argocd
spec:
  project: microservice-lab
  source:
    repoURL: git@github.com:jiuyue1123/microservice-lab-gitops.git
    targetRevision: master
    path: argocd/applications
    kustomize: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
