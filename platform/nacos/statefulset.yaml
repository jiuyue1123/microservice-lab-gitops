apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nacos
  namespace: microservice-lab-platform
  annotations:
    argocd.argoproj.io/sync-wave: "18"
spec:
  serviceName: nacos-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nacos
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nacos
        app.kubernetes.io/part-of: microservice-lab
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: nacos
          image: nacos/nacos-server:v3.2.4
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: client
              containerPort: 8848
            - name: grpc-client
              containerPort: 9848
            - name: grpc-server
              containerPort: 9849
            - name: raft
              containerPort: 7848
            - name: console
              containerPort: 8080
          env:
            - name: MODE
              value: standalone
            - name: SPRING_DATASOURCE_PLATFORM
              value: mysql
            - name: MYSQL_DATABASE_NUM
              value: "1"
            - name: MYSQL_SERVICE_HOST
              value: mysql-nacos
            - name: MYSQL_SERVICE_PORT
              value: "3306"
            - name: MYSQL_SERVICE_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: mysql-nacos-credentials
                  key: mysql-database
            - name: MYSQL_SERVICE_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-nacos-credentials
                  key: mysql-username
            - name: MYSQL_SERVICE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-nacos-credentials
                  key: mysql-password
            - name: MYSQL_SERVICE_DB_PARAM
              value: "characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useUnicode=true&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true"
            - name: NACOS_AUTH_ENABLE
              value: "true"
            - name: NACOS_AUTH_CONSOLE_ENABLE
              value: "true"
            - name: NACOS_AUTH_ADMIN_ENABLE
              value: "true"
            - name: NACOS_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: nacos-secrets
                  key: auth-token
            - name: NACOS_AUTH_IDENTITY_KEY
              valueFrom:
                secretKeyRef:
                  name: nacos-secrets
                  key: auth-identity-key
            - name: NACOS_AUTH_IDENTITY_VALUE
              valueFrom:
                secretKeyRef:
                  name: nacos-secrets
                  key: auth-identity-value
            - name: JVM_XMS
              value: 256m
            - name: JVM_XMX
              value: 512m
            - name: JVM_XMN
              value: 128m
            - name: JVM_MS
              value: 64m
            - name: JVM_MMS
              value: 128m
            - name: TZ
              value: Asia/Shanghai
          startupProbe:
            tcpSocket:
              port: 8848
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /nacos/v3/admin/core/state/readiness
              port: 8848
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /nacos/v3/admin/core/state/readiness
              port: 8848
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 1Gi
          volumeMounts:
            - name: logs
              mountPath: /home/nacos/logs
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: logs
      spec:
        storageClassName: microservice-lab-local
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
