apiVersion: batch/v1
kind: Job
metadata:
  name: nacos-schema
  namespace: microservice-lab-platform
  annotations:
    argocd.argoproj.io/sync-wave: "15"
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nacos-schema
        app.kubernetes.io/part-of: microservice-lab
    spec:
      restartPolicy: OnFailure
      containers:
        - name: schema
          image: mysql:8.4.11
          imagePullPolicy: IfNotPresent
          env:
            - name: MYSQL_HOST
              value: mysql-nacos
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: mysql-nacos-credentials
                  key: mysql-database
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-nacos-credentials
                  key: mysql-username
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-nacos-credentials
                  key: mysql-password
          command:
            - sh
            - -ec
            - |
              export MYSQL_PWD="$MYSQL_PASSWORD"
              until mysqladmin ping -h "$MYSQL_HOST" -u "$MYSQL_USER" --silent; do
                sleep 2
              done
              if mysql -h "$MYSQL_HOST" -u "$MYSQL_USER" -N -e \
                "SELECT 1 FROM information_schema.tables WHERE table_schema='$MYSQL_DATABASE' AND table_name='config_info' LIMIT 1;" \
                | grep -q 1; then
                echo "nacos schema already present"
                exit 0
              fi
              mysql --force -h "$MYSQL_HOST" -u "$MYSQL_USER" "$MYSQL_DATABASE" < /schema/mysql-schema.sql
          volumeMounts:
            - name: schema
              mountPath: /schema
      volumes:
        - name: schema
          configMap:
            name: nacos-schema
