apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway
  namespace: microservice-lab-apps
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - gateway.lan
      secretName: gateway-lan-tls
  rules:
    - host: gateway.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8080
