apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mysql-auth
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: microservice-lab
  destination:
    server: https://kubernetes.default.svc
    namespace: microservice-lab-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
  sources:
    - repoURL: https://groundhog2k.github.io/helm-charts/
      chart: mysql
      targetRevision: "3.1.4"
      helm:
        releaseName: mysql-auth
        valueFiles:
          - $values/platform/mysql-auth/values.yaml
    - repoURL: git@github.com:jiuyue1123/microservice-lab-gitops.git
      targetRevision: master
      ref: values
