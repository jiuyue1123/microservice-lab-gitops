apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nacos
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "18"
spec:
  project: microservice-lab
  destination:
    server: https://kubernetes.default.svc
    namespace: microservice-lab-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
  source:
    repoURL: git@github.com:jiuyue1123/microservice-lab-gitops.git
    targetRevision: master
    path: platform/nacos
